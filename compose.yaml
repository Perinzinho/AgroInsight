services:
  api:
    build:
      context: .
      target: api
    init: true
    restart: unless-stopped
    env_file:
      - path: ./FrontEnd/.env
        required: false
      - path: ./.env
        required: false
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: "5175"
      AI_DATA_DIR: ./public/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5175/api/ai/status').then(async r => { if (!r.ok || !(await r.json()).dataReady) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGROINSIGHT_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
