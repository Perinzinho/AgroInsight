server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve again when Compose recreates the API container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $ai_backend http://api:5175;
        proxy_pass $ai_backend;
        # Preserve the browser host/origin for the API's local access checks.
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ignore_client_abort off;
        # The API enforces its 64 KiB limit and returns a JSON error.
        client_max_body_size 0;
    }

    location /data/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
